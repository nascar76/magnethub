
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>MagnetHub</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#101827;color:#f1f5f9;font-family:Arial,sans-serif}
main{max-width:520px;margin:auto}
h1{color:#67e8f9;font-size:30px}
p{color:#aab8ca;line-height:1.5}
input,button{width:100%;padding:14px;margin:7px 0;border-radius:10px;font-size:16px}
input{background:#202d40;color:white;border:1px solid #40516a}
button{background:#0891b2;color:white;border:0;font-weight:bold}
.panel{background:#192538;padding:16px;border-radius:14px;margin:18px 0}
.item{overflow-wrap:anywhere;border-top:1px solid #40516a;padding:12px 0}
.small{font-size:13px}
</style>
</head>
<body>
<main>
<h1>◈ MagnetHub</h1>
<p>Cerca, organizza e gestisci i tuoi link magnet.</p>
<section class="panel">
<h3>⌕ Cerca un file</h3>
<form id="search">
<input id="query" placeholder="Nome del file..." required>
<button>Cerca sul web</button>
</form>
<p class="small">La ricerca apre Google. La ricerca torrent integrata arriverà in seguito.</p>
</section>
<section class="panel">
<h3>＋ Aggiungi un magnet</h3>
<input id="magnet" placeholder="Incolla un link magnet...">
<button id="save">Salva link</button>
<div id="message"></div>
</section>
<section class="panel">
<h3>▤ I miei link</h3>
<div id="links"></div>
</section>
<section class="panel">
<h3>☁ Real-Debrid</h3>
<p>Integrazione non ancora attiva. La aggiungeremo in una fase successiva.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function read(){
try{return JSON.parse(localStorage.getItem('mh-links')||'[]')}
catch{return []}
}
function render(){
$('links').replaceChildren();
read().forEach((link,i)=>{
const row=document.createElement('div');
row.className='item';
const txt=document.createElement('p');
txt.textContent=link;
const copy=document.createElement('button');
copy.textContent='Copia link';
copy.onclick=async()=>{
try{await navigator.clipboard.writeText(link);copy.textContent='Copiato!'}
catch{$('message').textContent='Copia non disponibile nel browser.'}
};
const del=document.createElement('button');
del.textContent='Elimina';
del.onclick=()=>{
const a=read();a.splice(i,1);
localStorage.setItem('mh-links',JSON.stringify(a));render();
};
row.append(txt,copy,del);$('links').append(row);
});
if(!$('links').children.length)$('links').textContent='Nessun link salvato.';
}
$('search').onsubmit=e=>{
e.preventDefault();
const q=$('query').value.trim();
if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');
};
$('save').onclick=()=>{
const m=$('magnet').value.trim();
if(!m.startsWith('magnet:?')){
$('message').textContent='Inserisci un link magnet valido.';
return;
}
try{
const a=read();
if(!a.includes(m))a.unshift(m);
localStorage.setItem('mh-links',JSON.stringify(a));
$('magnet').value='';$('message').textContent='Link salvato!';
render();
}catch{$('message').textContent='Impossibile salvare il link.'}
};
render();
</script>
</body>
</html>
